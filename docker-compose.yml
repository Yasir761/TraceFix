services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: tracefix-falkordb
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - tracefix_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  tracefix_data:
